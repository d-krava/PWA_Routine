<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи · My Routine</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">My Routine</div>
<a class="nav-link " href="index.html">🏠 Сегодня</a>
<a class="nav-link active" href="tasks.html">✅ Задачи</a>
<a class="nav-link " href="habits.html">🔁 Привычки</a>
<a class="nav-link " href="calendar.html">📅 Календарь</a>
<a class="nav-link " href="more.html">⚙️ Ещё</a>
</aside>
<main class="content">
<h1 class="page-title">Задачи</h1>
<p class="page-sub">Добавляй, фильтруй и отмечай свои дела</p>

<div class="card">
<div class="row"><input id="taskInput" placeholder="Что нужно сделать?"><select id="taskCategory"><option value="university">Университет</option><option value="sport">Спорт</option><option value="personal">Личное</option><option value="work">Работа / стажировка</option></select><select id="taskPriority"><option value="high">🔴 Важно</option><option value="medium">🟡 Средне</option><option value="low">🟢 Позже</option></select><input type="date" id="taskDue"><button onclick="addTask()">Добавить</button></div>
<div class="filters"><div class="filter active" data-filter="all" onclick="setFilter('all')">Все</div><div class="filter" data-filter="today" onclick="setFilter('today')">Сегодня</div><div class="filter" data-filter="overdue" onclick="setFilter('overdue')">Просроченные</div><div class="filter" data-filter="university" onclick="setFilter('university')">Университет</div><div class="filter" data-filter="sport" onclick="setFilter('sport')">Спорт</div><div class="filter" data-filter="personal" onclick="setFilter('personal')">Личное</div><div class="filter" data-filter="work" onclick="setFilter('work')">Работа</div></div>
<ul id="taskList"></ul>
</div>

</main>
<nav class="bottom-nav">
<a href="index.html" class=""><span>🏠</span>Сегодня</a>

</nav>
</div>

</body>
</html>
