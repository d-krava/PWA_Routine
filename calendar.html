<h1 class="page-title">Календарь</h1>
<p class="page-sub">Отмечай тренировки и смотри активность по месяцам</p>

<div class="card">
<div class="calendar-head"><button class="nav-btn" onclick="changeMonth(-1)">‹</button><strong id="monthLabel"></strong><button class="nav-btn" onclick="changeMonth(1)">›</button></div>
<div class="calendar" id="calendar"></div><div class="gym-stats" id="calendarStats" style="margin-top:14px;color:var(--muted);text-align:center"></div>
<h3>Тип активности на сегодня</h3><div class="workout-types" id="workoutTypes" style="display:flex;flex-wrap:wrap;gap:8px"></div>
</div>
<div class="card"><h2>Статистика недели</h2><div class="week-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px"><div class="week-stat" style="background:var(--main-soft);border-radius:14px;padding:12px;text-align:center"><b id="weekWorkouts">0</b><span>тренировок</span></div><div class="week-stat" style="background:var(--main-soft);border-radius:14px;padding:12px;text-align:center"><b id="weekHabits">0%</b><span>привычек</span></div><div class="week-stat" style="background:var(--main-soft);border-radius:14px;padding:12px;text-align:center"><b id="weekTasks">0</b><span>заданий</span></div></div></div>
